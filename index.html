<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Card Catcher Mini App</title>
<meta name="description" content="Browse the card shop, view shared cards and manage your own collection." />
<style>
  html,body { margin:0; background:#0b0f1a; color:#e5e7eb; font-family:-apple-system,system-ui,sans-serif; }
  .state { text-align:center; padding:48px 16px; opacity:.7; font-size:14px; }
  a { color:#fbbf24; }
</style>
</head>
<body>
<div class="state" id="s">Loading Card Catcher Mini App…</div>
<script>
(function(){
  var BACKEND = "https://card-catcher-bot.lovable.app";
  fetch(BACKEND + "/app", { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(html){
      // Make relative API paths resolve against the backend.
      html = html.replace('var API = "";', 'var API = "' + BACKEND + '";');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.getElementById("s").innerHTML =
        "Could not load the Mini App.<br/><br/>" +
        '<a href="' + BACKEND + '/app">Open directly</a>';
    });
})();
</script>
</body>
</html>
